<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>آجِل – تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E56}a:hover{color:#085041}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; background: #F5F7F6; font-family: 'Tajawal', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 72px; height: 72px; border-radius: 20px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700">آ</div>
<div style="font-size: 28px; font-weight: 700">آجِل</div>
<div style="font-size: 15px; color: #5B6B70">دفتر ديون البقالة</div>
</div>
<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3D4B50">رقم جوال البقالة
<input type="tel" value="777 123 456" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 17px; color: #1F2A2E; background: #FFFFFF; direction: ltr; text-align: right">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3D4B50">رقم المستخدم
<input type="number" value="1" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 17px; color: #1F2A2E; background: #FFFFFF">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3D4B50">الفرع
<select style="height: 52px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 16px; color: #1F2A2E; background: #FFFFFF">
<option>الفرع الرئيسي</option>
<option>فرع السوق</option>
</select>
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3D4B50">كلمة المرور
<input type="password" value="12345678" style="height: 52px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 17px; color: #1F2A2E; background: #FFFFFF">
</label>
<div style="font-size: 13px; color: #5B6B70">آخر دخول: الفرع الرئيسي — يُحفظ تلقائياً</div>
<button type="button" style="height: 54px; border: none; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700">دخول</button>
<button type="button" style="height: 54px; border: 1px solid #C9D6D2; border-radius: 14px; background: #FFFFFF; color: {{accent}}; font: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0v3"></path><path d="M9 11a3 3 0 0 1 6 0v2a8 8 0 0 1-1.5 5"></path><path d="M12 11v2a11 11 0 0 1-2 6"></path><path d="M18 16a14 14 0 0 1-.8 3"></path><path d="M6 14a9 9 0 0 0 .7 3"></path></svg>
الدخول بالبصمة
</button>
</form>
<div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 15px">
<a href="#">نسيت كلمة المرور؟</a>
<a href="#">إنشاء بقالة جديدة</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E56","options":["#0F6E56","#185FA5","#3C3489"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0F6E56' };
}
}
</script>
</body>
</html>
