<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>آجِل – اختيار فترة التقرير</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E56}a:hover{color:#085041}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #2A3633; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; justify-content: flex-end">
<div style="flex: 1; padding: 18px 16px; color: #8FA19C; font-size: 14px">التقارير (خلف النافذة)</div>
<section role="dialog" aria-label="اختيار فترة التقرير" style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D5DDDB"></span>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">اختر الفترة</h2>
<a href="Reports.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6B70">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div role="tablist" aria-label="نوع الفترة" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EEF2F1; border-radius: 12px; padding: 4px; gap: 4px">
<button type="button" role="tab" aria-selected="false" style="height: 38px; border-radius: 9px; border: none; background: transparent; color: #5B6B70; font: inherit; font-size: 14px">يوم</button>
<button type="button" role="tab" aria-selected="true" style="height: 38px; border-radius: 9px; border: none; background: #FFFFFF; color: #085041; font: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(15, 40, 35, 0.12)">شهر</button>
<button type="button" role="tab" aria-selected="false" style="height: 38px; border-radius: 9px; border: none; background: transparent; color: #5B6B70; font: inherit; font-size: 14px">سنة</button>
<button type="button" role="tab" aria-selected="false" style="height: 38px; border-radius: 9px; border: none; background: transparent; color: #5B6B70; font: inherit; font-size: 14px">من – إلى</button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="السنة السابقة" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #1F2A2E; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="flex: 1; display: flex; justify-content: center; gap: 8px">
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #1F2A2E; font: inherit; font-size: 15px">2024</button>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #1F2A2E; font: inherit; font-size: 15px">2025</button>
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #0F6E56; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">2026</button>
</div>
<button type="button" disabled aria-label="السنة التالية (غير متاحة)" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #EEF2F1; background: #FFFFFF; color: #B7C2BF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12">
<button type="button" style="height: 64px; border-radius: 14px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 15px; font-weight: {{m.weight}}">{{m.name}}</span>
<span style="font-size: 11px; color: {{m.subFg}}">{{m.sub}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5B6B70">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
الرقم تحت كل شهر = التحصيل بالألف ر.ي · الأشهر القادمة غير متاحة
</div>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
<button type="button" style="height: 54px; border-radius: 14px; border: 1px solid #C9D6D2; background: #FFFFFF; color: #0F6E56; font: inherit; font-size: 15px; font-weight: 500">الشهر الحالي</button>
<a href="Reports.dc.html" style="height: 54px; border-radius: 14px; background: #0F6E56; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">عرض نوفمبر 2026</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var names = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
var paid = ['388', '402', '431', '455', '470', '498', '512', '530', '561', '547', '612', ''];
var months = names.map(function (n, i) {
  var sel = i === 10, future = i === 11;
  return {
    name: n,
    sub: future ? 'قادم' : paid[i] + (sel ? ' · حتى الآن' : ''),
    bg: sel ? '#0F6E56' : future ? '#F5F7F6' : '#FFFFFF',
    fg: sel ? '#FFFFFF' : future ? '#B7C2BF' : '#1F2A2E',
    subFg: sel ? '#CFEDE3' : future ? '#B7C2BF' : '#5B6B70',
    border: sel ? '#0F6E56' : future ? '#EEF2F1' : '#D5DDDB',
    weight: sel ? '600' : '500'
  };
});
return { months: months };
}
}
</script>
</body>
</html>
