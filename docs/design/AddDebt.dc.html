<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>آجِل – تسجيل دين</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E56}a:hover{color:#085041}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Tajawal', sans-serif; color: #1F2A2E; display: flex; flex-direction: column">
<header style="padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E3E9E7">
<a href="Customer.dc.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1F2A2E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column">
<div style="font-size: 18px; font-weight: 700">تسجيل دين</div>
<div style="font-size: 13px; color: #5B6B70">محمد سالم · الفرع الرئيسي</div>
</div>
</header>
<div style="padding: 20px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-size: 44px; font-weight: 700; color: #B03224; direction: ltr">12,500</div>
<div role="group" aria-label="العملة" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EEF2F1; border-radius: 12px; padding: 4px; width: 220px">
<button type="button" aria-pressed="true" style="height: 38px; border: none; border-radius: 9px; background: #FFFFFF; color: #1F2A2E; font: inherit; font-size: 15px; font-weight: 700">ر.ي</button>
<button type="button" style="height: 38px; border: none; border-radius: 9px; background: transparent; color: #3D4B50; font: inherit; font-size: 15px">ر.س</button>
</div>
<div style="font-size: 13px; color: #5B6B70">العملة الافتراضية للزبون: ريال يمني</div>
</div>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #3D4B50">الوصف (اختياري)
<input type="text" value="مواد غذائية" style="height: 46px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; color: #1F2A2E">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #3D4B50">رقم الفاتورة
<input type="text" value="A-0142" style="height: 46px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; color: #1F2A2E; direction: ltr; text-align: right">
</label>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #3D4B50">التاريخ
<div style="height: 46px; box-sizing: border-box; border-radius: 12px; padding: 0 12px; background: #F5F7F6; display: flex; align-items: center; font-size: 15px; color: #1F2A2E">اليوم 9:40 م</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #3D4B50">موعد السداد (اختياري — للتنبيه)</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #1F2A2E; color: #FFFFFF; font: inherit; font-size: 13px">بدون موعد</button>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #3D4B50; font: inherit; font-size: 13px">غداً</button>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #3D4B50; font: inherit; font-size: 13px">بعد أسبوع</button>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #3D4B50; font: inherit; font-size: 13px">آخر الشهر</button>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D5DDDB; background: #FFFFFF; color: #3D4B50; font: inherit; font-size: 13px">تاريخ…</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: #F5F7F6; font-size: 14px">
<span style="color: #5B6B70">الرصيد بعد العملية</span>
<span style="font-weight: 700; color: #B03224">45,250 ر.ي</span>
</div>
</div>
<div style="margin-top: auto; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 12px; background: #F5F7F6">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; direction: ltr">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" aria-label="{{k.label}}" style="height: 46px; border: none; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 22px; color: #1F2A2E">{{k.t}}</button>
</sc-for>
</div>
<button type="button" style="height: 56px; border: none; border-radius: 14px; background: #B03224; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700">حفظ الدين</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var t = ['1','2','3','4','5','6','7','8','9','000','0','⌫'];
return { keys: t.map(function (x) { return { t: x, label: x === '⌫' ? 'حذف' : x }; }) };
}
}
</script>
</body>
</html>
