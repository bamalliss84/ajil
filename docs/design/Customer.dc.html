<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>آجِل – كشف حساب الزبون</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E56}a:hover{color:#085041}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'Tajawal', sans-serif; color: #1F2A2E; display: flex; flex-direction: column">
<header style="background: #FFFFFF; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E3E9E7">
<div style="display: flex; align-items: center; gap: 10px">
<a href="Customers.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1F2A2E">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column">
<div style="font-size: 19px; font-weight: 700">محمد سالم</div>
<div style="font-size: 13px; color: #5B6B70; direction: ltr; text-align: right">777 412 908</div>
</div>
<a href="Promise.dc.html" aria-label="تسجيل وعد سداد" style="width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #D5DDDB; border-radius: 12px; background: #FFFFFF; color: #A15C07; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
</a>
<button type="button" aria-label="مشاركة الكشف عبر واتساب" style="width: 44px; height: 44px; border: 1px solid #D5DDDB; border-radius: 12px; background: #FFFFFF; color: #1E7A43; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 19z"></path></svg>
</button>
<button type="button" aria-label="تصدير PDF" style="width: 44px; height: 44px; border: 1px solid #D5DDDB; border-radius: 12px; background: #FFFFFF; color: #3D4B50; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #FCEDEB; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #7A2318">المتبقي · ريال يمني</div>
<div style="font-size: 22px; font-weight: 700; color: #B03224">45,250</div>
<div style="font-size: 12px; color: #7A2318">ديون 65,250 · مسدد 20,000</div>
</div>
<div style="background: #FCEDEB; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #7A2318">المتبقي · ريال سعودي</div>
<div style="font-size: 22px; font-weight: 700; color: #B03224">120</div>
<div style="font-size: 12px; color: #7A2318">ديون 300 · مسدد 180</div>
</div>
</div>
<a href="Promise.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FBEFD9; color: #7A4A07; font-size: 14px; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
<span style="flex: 1">وعد بالسداد: غداً الثلاثاء 17 نوفمبر · 20,000 ر.ي</span>
<span style="font-weight: 500">تعديل</span>
</a>
<div role="group" aria-label="نوع الكشف" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EEF2F1; border-radius: 12px; padding: 4px">
<button type="button" style="height: 38px; border: none; border-radius: 9px; background: transparent; color: #3D4B50; font: inherit; font-size: 14px">إجمالي</button>
<button type="button" aria-pressed="true" style="height: 38px; border: none; border-radius: 9px; background: #FFFFFF; color: #1F2A2E; font: inherit; font-size: 14px; font-weight: 700">تحليلي</button>
</div>
</header>
<div style="padding: 10px 16px 6px; font-size: 13px; color: #5B6B70; display: flex; justify-content: space-between">
<span>ريال يمني · الأحدث أولاً</span><span>الرصيد</span>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 16px; background: #FFFFFF; border-bottom: 1px solid #EEF2F1; min-height: 64px; box-sizing: border-box">
<span style="font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 8px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; flex: none; min-width: 52px; text-align: center">{{r.type}}</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 15px; font-weight: 500; color: {{r.amountColor}}">{{r.amount}}</span>
<span style="font-size: 12px; color: #5B6B70">{{r.note}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{r.balance}}</span>
<span style="font-size: 12px; display: flex; align-items: center; gap: 4px; color: {{r.syncColor}}">
<sc-if value="{{r.synced}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
<sc-if value="{{r.waiting}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
{{r.syncText}}</span>
</span>
</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E3E9E7; padding: 12px 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="AddDebt.dc.html" style="height: 54px; border-radius: 14px; border: 1.5px solid #E9B8B1; color: #B03224; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">تسجيل دين</a>
<a href="#" style="height: 54px; border-radius: 14px; background: #0F6E56; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">تسجيل سداد</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var debt = { badgeBg: '#FCEDEB', badgeFg: '#8E2519', amountColor: '#B03224' };
var pay = { badgeBg: '#E3F3E9', badgeFg: '#17603A', amountColor: '#1E7A43' };
var ok = { synced: true, waiting: false, syncText: 'متزامن', syncColor: '#1E7A43' };
var wait = { synced: false, waiting: true, syncText: 'بانتظار', syncColor: '#A15C07' };
return {
rows: [
Object.assign({ type: 'دين', amount: '+ 12,500', note: 'مواد غذائية · اليوم 9:40 م · A-0142', balance: '45,250' }, debt, wait),
Object.assign({ type: 'سداد', amount: '− 20,000', note: 'نقداً · أمس 6:15 م', balance: '32,750' }, pay, ok),
Object.assign({ type: 'دين', amount: '+ 8,250', note: 'خضار وفواكه · 12 نوفمبر', balance: '52,750' }, debt, ok),
{ type: 'إلغاء', amount: '− 3,000', note: 'إلغاء A-0118 · خطأ في المبلغ · أحمد', balance: '44,500', badgeBg: '#EEF2F1', badgeFg: '#3D4B50', amountColor: '#3D4B50', synced: true, waiting: false, syncText: 'متزامن', syncColor: '#1E7A43' },
Object.assign({ type: 'دين', amount: '+ 3,000', note: 'A-0118 · 10 نوفمبر', balance: '47,500' }, debt, ok),
{ type: 'افتتاحي', amount: '+ 44,500', note: 'رصيد من الدفتر الورقي · 1 نوفمبر', balance: '44,500', badgeBg: '#E6EEF8', badgeFg: '#1D4F86', amountColor: '#1F2A2E', synced: true, waiting: false, syncText: 'متزامن', syncColor: '#1E7A43' }
]
};
}
}
</script>
</body>
</html>
