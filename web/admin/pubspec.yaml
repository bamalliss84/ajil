name: ajil_admin
description: لوحة إدارة منصة آجِل (Flutter Web)
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ajil_core:
    path: ../../packages/ajil_core
  supabase_flutter: ^2.8.0
  decimal: ^3.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

# نفس قيود تطبيق app/ (Flutter 3.24)
dependency_overrides:
  app_links: 6.3.3
